# Non-secret API configuration. The same values the compose stack sets inline,
# lifted out so that changing one does not mean rebuilding an image.
#
# The addresses are Service names. `mongo`, `redis` and `kafka` resolve through
# cluster DNS to a stable ClusterIP, which is the whole difference between this
# and step 1: in compose the name resolved to a container IP that moved, so
# nginx needed a resolver and a re-lookup. Here the name resolves to a virtual
# address that does not move, and the balancing happens underneath it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: naukri-suvidha
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: naukri-suvidha
data:
  NODE_ENV: production
  PORT: '5001'
  LOG_LEVEL: info

  # ?replicaSet=rs0 so the driver runs discovery and offers transactions.
  # Without it a single seed host is treated as a direct connection and
  # `withTransaction` is refused, which is the whole point of the replica set.
  MONGODB_URI: mongodb://mongo:27017/naukri_suvidha?replicaSet=rs0
  # Set, so the cache, the rate-limit counters and the socket adapter are
  # shared. With an HPA deciding how many replicas exist, "correct without
  # Redis" stops being a position anyone can hold.
  REDIS_URL: redis://redis:6379
  # Set, so a handler killed mid-event has not committed its offset and the
  # event comes back. An autoscaler deletes pods as a matter of routine, so
  # this is the transport that matches how this deployment behaves.
  KAFKA_BROKERS: kafka:9092

  # The edge has already authenticated every request that reaches this
  # service, so it verifies no token and reads no user - it reads the identity
  # the gateway forwarded. The proof secret is in the Secret, not here.
  IDENTITY_MODE: gateway
  # For the socket handshake only. A Socket.IO handshake carries its token in
  # the connection payload and /socket.io is proxied straight through, so it
  # is the one entry point the gateway cannot authenticate and this service
  # introspects it itself.
  AUTH_SERVICE_URL: http://auth:5002

  ACCESS_TOKEN_TTL: 15m
  REFRESH_TOKEN_TTL: 7d
  BCRYPT_ROUNDS: '12'
  # The edge is a NodePort mapped to 8081 on the host by the kind config.
  CLIENT_ORIGIN: http://localhost:8081

  STORAGE_PROVIDER: local
  UPLOAD_DIR: /app/server/uploads
  MAX_UPLOAD_BYTES: '5242880'

  LLM_PROVIDER: ollama
  # The model is not in the cluster: it is large, and the portal is built to
  # degrade without it. Pods cannot use `host.docker.internal` the way compose
  # containers can, so this is the gateway of the kind Docker network, which
  # `npm run k8s:up` writes for the host it is running on.
  OLLAMA_BASE_URL: http://172.18.0.1:11434
  OLLAMA_MODEL: llama3.1:8b
  AI_CONCURRENCY: '2'
  EMBEDDING_MODEL: nomic-embed-text
  VECTOR_INDEX: memory
---
# The auth service's non-secret configuration.
#
# A second ConfigMap rather than more keys in the first, and that separation
# is the point of the step: the two services are configured independently, so
# changing one cannot roll the other. The overlap is deliberate and small -
# the mongo host, the token TTLs, the bcrypt cost - and the one value that
# must match byte for byte, the JWT secrets, is in the shared Secret rather
# than copied into both of these.
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-config
  namespace: naukri-suvidha
  labels:
    app.kubernetes.io/name: auth
    app.kubernetes.io/part-of: naukri-suvidha
data:
  NODE_ENV: production
  PORT: '5002'
  LOG_LEVEL: info

  # Its own database on the same replica set, not its own collections in the
  # API's. The API has no connection that could read `users` even by mistake,
  # which is ownership enforced rather than remembered.
  MONGODB_URI: mongodb://mongo:27017/naukri_suvidha_auth?replicaSet=rs0
  # Shared with this service's own replicas, so five login attempts a minute
  # means five rather than five per pod.
  REDIS_URL: redis://redis:6379

  ACCESS_TOKEN_TTL: 15m
  REFRESH_TOKEN_TTL: 7d
  BCRYPT_ROUNDS: '12'
  CLIENT_ORIGIN: http://localhost:8081

  # Where to create the Student or Company row a new account implies. It goes
  # to the api Service directly, not through the edge: this is a
  # service-to-service call and has no business taking a route through the
  # public entry point - which would also mean its own auth_request.
  API_INTERNAL_URL: http://api:5001
