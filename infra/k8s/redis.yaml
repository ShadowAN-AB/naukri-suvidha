# A Deployment, not a StatefulSet, and no volume at all - which is a statement
# about what this Redis is for. It holds the shared cache, the rate-limit
# counters and the socket pub/sub channels: all of it derived, all of it
# rebuildable, none of it worth persisting. The compose stack says the same
# thing with `--save '' --appendonly no`.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: naukri-suvidha
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: naukri-suvidha
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: naukri-suvidha
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: naukri-suvidha
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: naukri-suvidha
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ['redis-server', '--save', '', '--appendonly', 'no']
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            exec:
              command: ['redis-cli', 'ping']
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 20
