# The edge: the built SPA, the reverse proxy, and the thing that proves the
# Service is balancing.
#
# The image is the same one compose builds - nginx with the client's dist
# baked in and infra/nginx/default.conf.template at
# /etc/nginx/templates/default.conf.template. The ConfigMap below mounts over
# that one file, so one image serves both stacks and each gets the upstream
# strategy that is correct for it. Baking a second image would mean the k8s
# edge could drift from the compose edge in ways nothing would catch.
#
# A template since step 5, because the edge authenticates and the secret it
# presents must come from the Secret rather than the image. nginx's entrypoint
# runs envsubst over the templates directory before starting, so the mount
# target moved from conf.d to templates and the substitution happens on the
# ConfigMap's contents.
apiVersion: v1
kind: Service
metadata:
  name: edge
  namespace: naukri-suvidha
  labels:
    app.kubernetes.io/name: edge
    app.kubernetes.io/part-of: naukri-suvidha
spec:
  # NodePort, not LoadBalancer: kind has no cloud controller to satisfy a
  # LoadBalancer, so it would sit <pending> forever. 30080 is mapped to 8081
  # on the host by infra/k8s/kind-cluster.yaml.
  #
  # A NodePort is open on *every* node, and kube-proxy forwards from whichever
  # node received the packet to whichever node holds the pod. So the mapping
  # being on the control-plane node does not mean the edge has to be scheduled
  # there - that indirection is the same machinery as the api Service.
  type: NodePort
  selector:
    app.kubernetes.io/name: edge
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge
  namespace: naukri-suvidha
  labels:
    app.kubernetes.io/name: edge
    app.kubernetes.io/part-of: naukri-suvidha
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: edge
  template:
    metadata:
      annotations:
        # `naukri-suvidha/api:dev` is a mutable tag: rebuilding changes what it
        # points at without changing its name, so the pod template is byte for
        # byte identical and `kubectl apply` reports "unchanged" while the pods
        # keep running the previous build. That is a genuinely confusing way to
        # lose twenty minutes - the manifests are applied, the image is loaded,
        # and the fix is still not running.
        #
        # up.sh substitutes the built image's id here, which makes the content
        # part of the template. A rebuild that changed nothing leaves this
        # alone and apply is correctly a no-op; a rebuild that changed
        # something rolls the Deployment.
        naukri-suvidha/image-id: '__EDGE_IMAGE_ID__'
        # Rolls the edge when the gateway config changes. The ConfigMap is
        # generated without a content hash - see kustomization.yaml - so
        # without this a config edit would leave the running pod on the old
        # one, which is the mutable-tag trap wearing a different hat.
        naukri-suvidha/config-hash: '__EDGE_CONFIG_HASH__'
      labels:
        app.kubernetes.io/name: edge
        app.kubernetes.io/part-of: naukri-suvidha
    spec:
      containers:
        - name: edge
          image: naukri-suvidha/edge:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            # The secret the edge presents with every identity it forwards and
            # on its introspection subrequest. envsubst writes it into the
            # config at start-up.
            - name: AUTH_GATEWAY_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: AUTH_GATEWAY_SECRET
            # Without this filter envsubst replaces every $name it recognises
            # from the environment, which would eat nginx's own $host,
            # $remote_addr and $request_id and produce a config that starts and
            # is quietly wrong.
            - name: NGINX_ENVSUBST_FILTER
              value: AUTH_GATEWAY_SECRET
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/templates/default.conf.template
              subPath: default.conf.template
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: conf
          configMap:
            # Generated by kustomize from edge-nginx.conf.template, so the
            # config stays a real nginx file that can be read and diffed
            # against the compose one instead of a quoted blob inside YAML.
            name: edge-nginx
            items:
              - key: edge-nginx.conf.template
                path: default.conf.template
