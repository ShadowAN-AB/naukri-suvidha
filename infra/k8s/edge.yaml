# The edge: the built SPA, the reverse proxy, and the thing that proves the
# Service is balancing.
#
# The image is the same one compose builds - nginx with the client's dist
# baked in and infra/nginx/default.conf at /etc/nginx/conf.d/default.conf.
# The ConfigMap below mounts over that one file, so one image serves both
# stacks and each gets the upstream strategy that is correct for it. Baking a
# second image would mean the k8s edge could drift from the compose edge in
# ways nothing would catch.
apiVersion: v1
kind: Service
metadata:
  name: edge
  namespace: naukri-suvidha
  labels:
    app.kubernetes.io/name: edge
    app.kubernetes.io/part-of: naukri-suvidha
spec:
  # NodePort, not LoadBalancer: kind has no cloud controller to satisfy a
  # LoadBalancer, so it would sit <pending> forever. 30080 is mapped to 8081
  # on the host by infra/k8s/kind-cluster.yaml.
  #
  # A NodePort is open on *every* node, and kube-proxy forwards from whichever
  # node received the packet to whichever node holds the pod. So the mapping
  # being on the control-plane node does not mean the edge has to be scheduled
  # there - that indirection is the same machinery as the api Service.
  type: NodePort
  selector:
    app.kubernetes.io/name: edge
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge
  namespace: naukri-suvidha
  labels:
    app.kubernetes.io/name: edge
    app.kubernetes.io/part-of: naukri-suvidha
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: edge
  template:
    metadata:
      annotations:
        # `naukri-suvidha/api:dev` is a mutable tag: rebuilding changes what it
        # points at without changing its name, so the pod template is byte for
        # byte identical and `kubectl apply` reports "unchanged" while the pods
        # keep running the previous build. That is a genuinely confusing way to
        # lose twenty minutes - the manifests are applied, the image is loaded,
        # and the fix is still not running.
        #
        # up.sh substitutes the built image's id here, which makes the content
        # part of the template. A rebuild that changed nothing leaves this
        # alone and apply is correctly a no-op; a rebuild that changed
        # something rolls the Deployment.
        naukri-suvidha/image-id: '__EDGE_IMAGE_ID__'
      labels:
        app.kubernetes.io/name: edge
        app.kubernetes.io/part-of: naukri-suvidha
    spec:
      containers:
        - name: edge
          image: naukri-suvidha/edge:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: conf
          configMap:
            # Generated by kustomize from infra/k8s/edge-nginx.conf, so the
            # config stays a real nginx file that can be read and diffed
            # against the compose one instead of a quoted blob inside YAML.
            name: edge-nginx
            items:
              - key: edge-nginx.conf
                path: default.conf
