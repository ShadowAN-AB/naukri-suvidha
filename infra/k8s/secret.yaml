# Development secrets, committed on purpose - exactly as the compose stack
# does, and for the same reason: this stack has to come up with one command
# for a demonstration. Nothing here is reachable from outside the laptop, and
# Render generates real values from `render.yaml`.
#
# What this *does* demonstrate is the seam. The API reads these from a Secret
# and the non-secret values from a ConfigMap, so pointing it at real secrets
# is replacing this one object - not editing a deployment.
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: naukri-suvidha
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: naukri-suvidha
type: Opaque
stringData:
  # Read by both services, which is why this Secret is shared where the
  # ConfigMaps are not: the auth service mints the access tokens the API
  # verifies, so a mismatch here is a sign-in that appears to work and is then
  # refused everywhere. One object, no copy to drift.
  JWT_ACCESS_SECRET: kubernetes-development-access-secret-not-for-production
  JWT_REFRESH_SECRET: kubernetes-development-refresh-secret-not-for-production
  # The shared secret on every internal call: the edge presents it with each
  # identity it forwards and on its introspection subrequest, the auth service
  # requires it on /internal/*, and the API requires it before trusting a
  # forwarded identity. Three consumers, one value - the edge reads it as an
  # env var for envsubst, the two services as configuration.
  AUTH_GATEWAY_SECRET: kubernetes-development-gateway-secret
  # SMTP credentials for the email service. Development placeholders - real
  # values are set per cluster, same way JWT_* would be. On the demo laptop a
  # real app password goes in via `kubectl patch secret api-secrets ...` or
  # by generating this manifest from .env; the committed values are placeholders
  # that let the stack boot even without SMTP configured, with sends failing
  # loudly in EmailLog rather than silently.
  SMTP_USER: dev@example.test
  SMTP_PASS: not-a-real-password
