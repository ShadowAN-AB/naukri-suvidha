# Development secrets, committed on purpose - exactly as the compose stack
# does, and for the same reason: this stack has to come up with one command
# for a demonstration. Nothing here is reachable from outside the laptop, and
# Render generates real values from `render.yaml`.
#
# What this *does* demonstrate is the seam. The API reads these from a Secret
# and the non-secret values from a ConfigMap, so pointing it at real secrets
# is replacing this one object - not editing a deployment.
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: naukri-suvidha
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: naukri-suvidha
type: Opaque
stringData:
  JWT_ACCESS_SECRET: kubernetes-development-access-secret-not-for-production
  JWT_REFRESH_SECRET: kubernetes-development-refresh-secret-not-for-production
