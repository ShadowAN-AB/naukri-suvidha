name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      # The suite runs against a real mongod, because the unique indexes and
      # the aggregations are exactly what it needs to be sure about.
      # The cache contract is run against a real Redis rather than a mock:
      # a mock would only confirm the mock.
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      # MongoDB is NOT a service container, deliberately - see the step below.

    steps:
      - uses: actions/checkout@v4

      # A service container cannot be given a command: the `services:` syntax
      # takes an image, env, ports and docker-create options, and nothing that
      # would let us pass `--replSet`. So mongod is started as a step instead.
      #
      # It has to be a replica set, not a standalone, because the outbox writes
      # the event and the business row in one transaction - and transactions
      # need a replica set. On a standalone the code falls back to publishing
      # after the write, so a standalone CI would pass while never once
      # exercising the transactional path.
      - name: Start MongoDB as a single-node replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 \
            mongod --replSet rs0 --bind_ip_all

          # The member host must be the address the tests connect on, because
          # a replica set advertises its members and the driver then connects
          # to the advertised name.
          for i in $(seq 1 30); do
            # stderr suppressed: the first probe or two land before mongod is
            # listening and print a connection error that means nothing here.
            if docker exec mongo mongosh --quiet --eval \
              "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] }).ok }" \
              2>/dev/null | grep -q 1; then
              echo "replica set up after ${i}s"; break
            fi
            sleep 1
          done

          # Fail loudly here rather than letting the suite fail obscurely.
          docker exec mongo mongosh --quiet --eval \
            "assert(rs.status().members[0].stateStr === 'PRIMARY', 'not PRIMARY')"
          echo "PRIMARY confirmed"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        # Everything the suite needs is in server/.env.test, which is committed
        # precisely so this step needs no secrets.
        run: npm test

      - name: Check the design document's claims
        # The document is a submittable artifact drafted against a different
        # codebase. This does not read it - it asserts that what its
        # retargeted sections say about this repo is still true, so a renamed
        # route or a dropped index fails here rather than in front of a marker.
        run: npm run docs:check

      - name: Build the client
        run: npm run build --workspace=client

      - name: Audit production dependencies
        # Dev-only advisories should not fail a build; a vulnerable package
        # that ships to users should.
        run: npm audit --omit=dev --audit-level=high
