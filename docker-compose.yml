# The whole portal on one machine, as containers.
#
# What this demonstrates, and why each piece is here rather than described:
#   · containerisation  - each service and the client build to an image
#   · load balancing    - nginx spreads /api over N API replicas
#   · horizontal scaling- `--scale api=N`, no host ports on the API at all
#   · an edge           - one nginx doing static hosting, proxying and caching
#   · microservices     - auth and notifications are each their own image,
#                         process and database
#   · an API gateway    - the edge routes by prefix and authenticates every
#                         /api request against the auth service before it
#                         reaches the API
#
# Everything here runs with `docker compose up --build`.

name: naukri-suvidha

services:
  # A single-node replica set, not a standalone.
  #
  # One node gives no redundancy and that is not why it is here: MongoDB
  # offers multi-document transactions only on a replica set, and without
  # transactions there can be no transactional outbox - so the publish-side
  # window in the event bus cannot be closed. One node is the smallest thing
  # that makes `session.withTransaction` legal.
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    volumes:
      - mongo-data:/data/db
    # 27018 on the host: a local mongod on the default port is normal on a
    # development machine and this must not fight it.
    #
    # Reaching it from the host now needs `directConnection=true`, because the
    # replica set advertises its member as `mongo:27017` - a name that resolves
    # inside this network and nowhere else. Everything in the stack connects by
    # that name, so only host-side debugging is affected.
    ports:
      - '27018:27017'
    # The healthcheck doubles as the initiator. A separate one-shot service
    # would have to be ordered against this one and would run before the node
    # is listening; doing it here is idempotent by construction - `rs.status()`
    # succeeds forever after the first `rs.initiate()`, and a node that somehow
    # lost its config initiates again rather than staying unhealthy.
    healthcheck:
      test:
        - 'CMD-SHELL'
        - >-
          mongosh --quiet --eval "try { rs.status().ok } catch (e) {
          rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }"
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 6380: a developer machine often already runs one on 6379.
    ports:
      - '6380:6379'
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10

  # KRaft mode: no ZooKeeper. One node, which is all a laptop needs and all
  # the demonstration requires - the interesting property is consumer groups,
  # not replication.
  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    ports:
      - '9094:9094'
    environment:
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      # Two listeners on purpose: containers reach the broker as `kafka`, and
      # anything on the host reaches it as `localhost`. A single advertised
      # name cannot be correct for both.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      # Zero, so a restarting replica rejoins its group immediately instead of
      # waiting out the default three seconds.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      CLUSTER_ID: naukri-suvidha-kraft-01
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1']
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 40s

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    # No `ports`. The API is deliberately unreachable from the host, so the
    # only way in is through the load balancer - which is the point, and also
    # what lets this scale past one replica without a port collision.
    deploy:
      replicas: 2
    environment:
      NODE_ENV: production
      PORT: '5001'
      LOG_LEVEL: info
      MONGODB_URI: mongodb://mongo:27017/naukri_suvidha?replicaSet=rs0
      # The edge has already authenticated every request that gets here, so
      # this process verifies no token and reads no user - it reads the
      # identity the gateway forwarded. The secret is what makes reaching this
      # container insufficient to claim one.
      IDENTITY_MODE: gateway
      AUTH_GATEWAY_SECRET: docker-compose-development-gateway-secret
      # For the socket handshake only. A Socket.IO handshake carries its token
      # in the connection payload and /socket.io is proxied straight through,
      # so it is the one entry point the gateway cannot authenticate and this
      # process introspects it itself.
      AUTH_SERVICE_URL: http://auth:5002
      # With this set, the cache, the rate limiter and the socket gateway are
      # shared between replicas. Without it each container keeps its own,
      # which is exactly the bug this step exists to fix.
      REDIS_URL: redis://redis:6379
      # With this set the domain events travel through the broker and survive
      # the process. Without it they are in-process and lost on restart.
      KAFKA_BROKERS: kafka:9092
      # Development values, in the repository on purpose: this stack is a demo
      # that must come up with one command. Render generates real ones.
      JWT_ACCESS_SECRET: docker-compose-development-access-secret-not-for-production
      JWT_REFRESH_SECRET: docker-compose-development-refresh-secret-not-for-production
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 7d
      BCRYPT_ROUNDS: '12'
      CLIENT_ORIGIN: http://localhost:8080
      STORAGE_PROVIDER: local
      UPLOAD_DIR: /app/server/uploads
      MAX_UPLOAD_BYTES: '5242880'
      LLM_PROVIDER: ollama
      # The model runs on the host, not in a container: it is large, and the
      # portal is built to degrade when it is absent anyway.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.1:8b
      AI_CONCURRENCY: '2'
      EMBEDDING_MODEL: nomic-embed-text
      VECTOR_INDEX: memory
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:5001/api/health']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  # Authentication, as its own service - step 5.
  #
  # Its own image, its own process, and above all its own *database*:
  # `naukri_suvidha_auth` on the same mongod, so the API has no connection
  # that could read `users` even by mistake. Ownership enforced rather than
  # remembered.
  #
  # No host port, same as the API, and for the same reason: the edge is the
  # only way in. It also has no Kafka and no uploads - authentication needs a
  # database, two secrets and a bcrypt cost.
  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '5002'
      LOG_LEVEL: info
      MONGODB_URI: mongodb://mongo:27017/naukri_suvidha_auth?replicaSet=rs0
      # Shared with the API's replicas, so five login attempts a minute means
      # five - not five per container.
      REDIS_URL: redis://redis:6379
      # Byte-identical to the API's. This service mints the access tokens that
      # one verifies; a mismatch is a login that appears to work and then is
      # refused everywhere.
      JWT_ACCESS_SECRET: docker-compose-development-access-secret-not-for-production
      JWT_REFRESH_SECRET: docker-compose-development-refresh-secret-not-for-production
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 7d
      BCRYPT_ROUNDS: '12'
      CLIENT_ORIGIN: http://localhost:8080
      AUTH_GATEWAY_SECRET: docker-compose-development-gateway-secret
      # Where to create the Student or Company row a new account implies. It
      # goes through the API's load balancer name, not the edge: this is a
      # service-to-service call and has no business taking a route through the
      # public entry point.
      API_INTERNAL_URL: http://api:5001
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:5002/health']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Notifications, as its own service - the second extraction.
  #
  # The contrast with `auth` above is the lesson of extracting an
  # event-driven service rather than a request-driven one. auth needs mongo
  # and nothing else; without a caller it is simply idle. This one has no
  # caller at all - every notification it creates begins with a Kafka message -
  # so **the broker is load-bearing here in a way it is not for the API**. The
  # API degrades to an in-process bus without it; this service has no
  # in-process publisher to listen to, and would serve an inbox that never
  # fills. Its /health says so rather than leaving it to be inferred.
  #
  # Redis is how it pushes. It holds no sockets: the client connects to
  # /socket.io on the API, and this service publishes through the same Redis
  # adapter channel, so whichever API replica holds that connection delivers
  # the emit. That adapter was added in step 2 to stop a second API replica
  # breaking realtime; it now carries an emit across a service boundary, which
  # is the same problem one layer out.
  notifications:
    build:
      context: .
      dockerfile: services/notifications/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '5003'
      LOG_LEVEL: info
      MONGODB_URI: mongodb://mongo:27017/naukri_suvidha_notifications?replicaSet=rs0
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379
      IDENTITY_MODE: gateway
      AUTH_GATEWAY_SECRET: docker-compose-development-gateway-secret
      JWT_ACCESS_SECRET: docker-compose-development-access-secret-not-for-production
      JWT_REFRESH_SECRET: docker-compose-development-refresh-secret-not-for-production
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 7d
      BCRYPT_ROUNDS: '12'
      CLIENT_ORIGIN: http://localhost:8080
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:5003/health']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  # Realtime, as its own service - the third extraction, and the cheapest.
  #
  # It owns no collection, read nothing and was read by nobody: it held the
  # Socket.IO server and that was all. So there is no `MONGODB_URI` here, and
  # that is the pattern applied honestly rather than bent - database-per-
  # service means one database per deployable that owns data, and live
  # connections are not data that can be persisted anywhere useful.
  #
  # Redis is the sharp dependency, sharper than for any other service. This
  # one holds every socket and publishes none of its own content: every push
  # originates in the API or notifications and arrives through the adapter's
  # pub/sub channel. So without Redis it accepts connections and delivers
  # nothing - not degraded, absent. Same lesson as the broker for
  # notifications, one layer out: extracting a component makes the transport
  # under it load-bearing.
  #
  # It needs the auth service, and it is the only service here that does. A
  # websocket upgrade cannot carry an `auth_request`, so the edge cannot
  # authenticate a handshake; whoever holds the socket introspects the token
  # itself. That call moved here with the sockets, which is why the API no
  # longer talks to auth at all.
  realtime:
    build:
      context: .
      dockerfile: services/realtime/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '5004'
      LOG_LEVEL: info
      REDIS_URL: redis://redis:6379
      AUTH_SERVICE_URL: http://auth:5002
      AUTH_SERVICE_TIMEOUT_MS: '2000'
      AUTH_GATEWAY_SECRET: docker-compose-development-gateway-secret
      JWT_ACCESS_SECRET: docker-compose-development-access-secret-not-for-production
      JWT_REFRESH_SECRET: docker-compose-development-refresh-secret-not-for-production
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 7d
      BCRYPT_ROUNDS: '12'
      CLIENT_ORIGIN: http://localhost:8080
    depends_on:
      # No mongo: there is nothing to connect to. The first service in this
      # file that does not wait for the database.
      redis:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:5004/health']
      interval: 10s
      timeout: 5s
      retries: 6
      # Shorter than the others' on purpose: no database to connect to, no
      # consumer groups to join. It binds a port and attaches a socket server.
      start_period: 5s

  # The email service - a fourth extraction, added for the evaluation and
  # recorded as deliberately out of the measured order.
  #
  # It sends email to students when an interview is scheduled, carrying date,
  # time and job title. Pure consumer like notifications: no caller, every
  # action begins with a Kafka message. The broker is load-bearing here for
  # the same reason - with no broker it serves /health and sends nothing.
  #
  # It is the first service that needs the auth service for data rather than
  # for a token: student emails live in naukri_suvidha_auth.users, so this
  # service calls /internal/users/:id/email to resolve the recipient. That is
  # the fourth service-to-service crossing documented in CLAUDE.md.
  #
  # SMTP credentials come from the host .env (gitignored). The sample at
  # services/email/.env.example documents the shape; the docker-compose
  # service reads SMTP_* and MAIL_FROM from the shell environment, falling
  # back to the stubs so a `docker compose up` without SMTP configured still
  # starts the service - every send then fails with an SMTP error, which the
  # EmailLog row records honestly.
  email:
    build:
      context: .
      dockerfile: services/email/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '5005'
      LOG_LEVEL: info
      MONGODB_URI: mongodb://mongo:27017/naukri_suvidha_email?replicaSet=rs0
      KAFKA_BROKERS: kafka:9092
      AUTH_SERVICE_URL: http://auth:5002
      AUTH_SERVICE_TIMEOUT_MS: '2000'
      AUTH_GATEWAY_SECRET: docker-compose-development-gateway-secret
      SMTP_HOST: ${SMTP_HOST:-smtp.example.test}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-dev@example.test}
      SMTP_PASS: ${SMTP_PASS:-not-a-real-password}
      MAIL_FROM: ${MAIL_FROM:-Naukri Suvidha <dev@example.test>}
      DEMO_EMAIL_OVERRIDE: ${DEMO_EMAIL_OVERRIDE:-}
      CLIENT_ORIGIN: http://localhost:8080
    depends_on:
      mongo:
        condition: service_healthy
      kafka:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:5005/health']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  edge:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    ports:
      - '8080:80'
    environment:
      # The secret the edge presents with every identity it forwards, and on
      # its introspection subrequest. envsubst puts it into the nginx config
      # at start-up; the filter is what stops it rewriting nginx's own $host
      # and $request_id at the same time.
      AUTH_GATEWAY_SECRET: docker-compose-development-gateway-secret
      NGINX_ENVSUBST_FILTER: AUTH_GATEWAY_SECRET
    depends_on:
      api:
        condition: service_healthy
      auth:
        condition: service_healthy
      notifications:
        condition: service_healthy
      # It proxies /socket.io here now, so a client that connects before this
      # is up gets a 502 rather than a retry.
      realtime:
        condition: service_healthy

  # Not started by default. `npm run docker:seed` runs it once and exits.
  #
  # That script passes `--build`, and it has to. `docker compose up --build`
  # skips services in a profile, so this image is not rebuilt with the rest of
  # the stack - and `run` without `--build` is happy to use whatever was
  # cached. A stale seed image wrote all 49 users into the API's database
  # instead of the auth service's, which left a seeded portal where nobody
  # could sign in: the students were there, their users were in the wrong
  # place, and nothing said so. Same shape as the Kubernetes mutable-tag trap.
  seed:
    build:
      context: .
      dockerfile: server/Dockerfile
    profiles: ['tools']
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/naukri_suvidha?replicaSet=rs0
      # Seeding is the one thing that writes both databases: a student profile
      # carries a userId, so the users have to exist and their ids have to
      # match. There is no ordering of two separate scripts that does that.
      AUTH_MONGODB_URI: mongodb://mongo:27017/naukri_suvidha_auth?replicaSet=rs0
      # --fresh wipes this too. Leaving notifications behind would leave rows
      # pointing at students who no longer exist, which looks like corruption
      # the first time you open the bell menu after a reseed.
      NOTIFICATIONS_MONGODB_URI: mongodb://mongo:27017/naukri_suvidha_notifications?replicaSet=rs0
      JWT_ACCESS_SECRET: docker-compose-development-access-secret-not-for-production
      JWT_REFRESH_SECRET: docker-compose-development-refresh-secret-not-for-production
      BCRYPT_ROUNDS: '10'
      CLIENT_ORIGIN: http://localhost:8080
      STORAGE_PROVIDER: local
      UPLOAD_DIR: /app/server/uploads
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    command: ['node', 'server/scripts/seed.js', '--fresh']
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
