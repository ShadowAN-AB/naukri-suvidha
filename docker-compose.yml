# The whole portal on one machine, as containers.
#
# What this demonstrates, and why each piece is here rather than described:
#   · containerisation  - the API and the client each build to an image
#   · load balancing    - nginx spreads /api over N API replicas
#   · horizontal scaling- `--scale api=N`, no host ports on the API at all
#   · an edge           - one nginx doing static hosting, proxying and caching
#
# Redis and Kafka arrive in the next two steps; this file is the floor they
# stand on. Everything here runs with `docker compose up --build`.

name: naukri-suvidha

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    # 27018 on the host: a local mongod on the default port is normal on a
    # development machine and this must not fight it.
    ports:
      - '27018:27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.runCommand({ping:1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 6380: a developer machine often already runs one on 6379.
    ports:
      - '6380:6379'
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10

  # KRaft mode: no ZooKeeper. One node, which is all a laptop needs and all
  # the demonstration requires - the interesting property is consumer groups,
  # not replication.
  kafka:
    image: apache/kafka:3.9.0
    restart: unless-stopped
    ports:
      - '9094:9094'
    environment:
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      # Two listeners on purpose: containers reach the broker as `kafka`, and
      # anything on the host reaches it as `localhost`. A single advertised
      # name cannot be correct for both.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      # Zero, so a restarting replica rejoins its group immediately instead of
      # waiting out the default three seconds.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: '0'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      CLUSTER_ID: naukri-suvidha-kraft-01
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1']
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 40s

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    # No `ports`. The API is deliberately unreachable from the host, so the
    # only way in is through the load balancer - which is the point, and also
    # what lets this scale past one replica without a port collision.
    deploy:
      replicas: 2
    environment:
      NODE_ENV: production
      PORT: '5001'
      LOG_LEVEL: info
      MONGODB_URI: mongodb://mongo:27017/naukri_suvidha
      # With this set, the cache, the rate limiter and the socket gateway are
      # shared between replicas. Without it each container keeps its own,
      # which is exactly the bug this step exists to fix.
      REDIS_URL: redis://redis:6379
      # With this set the domain events travel through the broker and survive
      # the process. Without it they are in-process and lost on restart.
      KAFKA_BROKERS: kafka:9092
      # Development values, in the repository on purpose: this stack is a demo
      # that must come up with one command. Render generates real ones.
      JWT_ACCESS_SECRET: docker-compose-development-access-secret-not-for-production
      JWT_REFRESH_SECRET: docker-compose-development-refresh-secret-not-for-production
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 7d
      BCRYPT_ROUNDS: '12'
      CLIENT_ORIGIN: http://localhost:8080
      STORAGE_PROVIDER: local
      UPLOAD_DIR: /app/server/uploads
      MAX_UPLOAD_BYTES: '5242880'
      LLM_PROVIDER: ollama
      # The model runs on the host, not in a container: it is large, and the
      # portal is built to degrade when it is absent anyway.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.1:8b
      AI_CONCURRENCY: '2'
      EMBEDDING_MODEL: nomic-embed-text
      VECTOR_INDEX: memory
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:5001/api/health']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  edge:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      api:
        condition: service_healthy

  # Not started by default. `npm run docker:seed` runs it once and exits.
  seed:
    build:
      context: .
      dockerfile: server/Dockerfile
    profiles: ['tools']
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/naukri_suvidha
      JWT_ACCESS_SECRET: docker-compose-development-access-secret-not-for-production
      JWT_REFRESH_SECRET: docker-compose-development-refresh-secret-not-for-production
      BCRYPT_ROUNDS: '10'
      CLIENT_ORIGIN: http://localhost:8080
      STORAGE_PROVIDER: local
      UPLOAD_DIR: /app/server/uploads
      LLM_PROVIDER: ollama
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    command: ['node', 'server/scripts/seed.js', '--fresh']
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
