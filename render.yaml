# Render blueprint for the API. Import this from the Render dashboard, then
# fill in the values marked sync:false - they are secrets and are deliberately
# not in the repository.
services:
  - type: web
    name: nexus-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start --workspace=server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info

      # Render injects PORT. The server reads it, because in production there
      # is no .env file for the local override to prefer.
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: BCRYPT_ROUNDS
        value: 12

      # Must match the deployed client exactly, or CORS and the refresh
      # cookie both fail.
      - key: CLIENT_ORIGIN
        sync: false

      # Render's disk is ephemeral, so local storage would lose every resume
      # on the next deploy.
      - key: STORAGE_PROVIDER
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

      - key: LLM_PROVIDER
        value: claude
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-5
      - key: AI_CONCURRENCY
        value: 2
