<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Nexus — an AI-assisted campus placement portal. Every job ranked by how well you fit it, with the reasoning attached."
    />
    <title>Nexus — Campus Placement</title>
    <script>
      /*
       * Runs before the first paint. React mounts a moment later, so without
       * this anyone who chose dark gets a white flash on every page load.
       * The key and the fallback must stay in step with ThemeContext.jsx.
       */
      (function () {
        try {
          var stored = localStorage.getItem('nexus-theme');
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* Private mode: fall through to the light theme. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
